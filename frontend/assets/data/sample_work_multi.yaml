# ============================================================
# Work（業務のプロジェクト）を複数件まとめて追加するときのサンプル（3 件）
# - 書き方は format_work.yaml と同じ。「- title:」から 1 件ずつ書く
# - 技術は [A, B] の形でも、「- A」を 1 行ずつ並べてもよい。該当しないものは 利用なし
# - workflow（担当した工程）は Work では必須
# ============================================================
projects:
  - title: サンプル・ワークプロジェクト
    description: チーム開発における設計から実装、テストまでのアジャイル開発を担当
    details: |
      要件定義を元にした詳細設計、バックエンドのAPI実装、フロントエンドのUI調整を実施。
      単体テストの作成やコードレビューを通じて品質担保に貢献。
    role: [PG]
    scale: ""
    server_os: [Linux, Windows]
    db: [PostgreSQL]
    tools: [Git, GitLab, VSCode]
    backend_frameworks: [Django]
    frontend_frameworks: [利用なし]
    ui_frameworks: [Bootstrap]
    testing_frameworks: [利用なし]
    cloud_platforms: [利用なし]
    aws_services: [利用なし]
    azure_services: [利用なし]
    gcp_services: [利用なし]
    container: [利用なし]
    container_orchestration: [利用なし]
    ai_services: [利用なし]
    skills: [Python]
    period: [2023-04, 2023-09]
    link: ""
    workflow:
      requirements: false
      basic_design: true
      detailed_design: true
      implementation_unit_test: true
      integration_test: true
      system_test: false
      maintenance_operation: false

  - title: サンプル・社内システムの改修
    description: 既存の社内システムの機能追加とクラウドへの移行を担当
    details: |
      既存の画面と API の機能追加・不具合修正を担当。
      オンプレミスから AWS への移行に合わせて、コンテナ化と動作確認を実施。
    role: [SE, PL]
    scale: 全体 12名（チーム 4名）
    server_os: [Linux]
    db: [Oracle]
    tools: [Git, GitHub, Jira]
    backend_frameworks: [Spring Boot]
    frontend_frameworks: [利用なし]
    ui_frameworks: [利用なし]
    testing_frameworks: [JUnit]
    cloud_platforms: [AWS]
    aws_services: [EC2, RDS]
    azure_services: [利用なし]
    gcp_services: [利用なし]
    container: [Docker]
    container_orchestration: [利用なし]
    ai_services: [利用なし]
    skills: [Java, SQL]
    period: [2023-10, 2024-06]
    link: ""
    workflow:
      requirements: false
      basic_design: false
      detailed_design: true
      implementation_unit_test: true
      integration_test: true
      system_test: true
      maintenance_operation: false

  - title: サンプル・AI を使った業務の自動化
    description: 生成 AI を使った問い合わせ対応の自動化を、要件定義から運用まで担当
    details: |
      問い合わせの分類と回答案の作成を生成 AI で自動化する仕組みを開発。
      要件定義から運用・改善までを担当。
    role: [SE]
    scale: 5名
    server_os: [Linux]
    db: [PostgreSQL]
    tools: [Git, GitHub, Slack]
    backend_frameworks: [FastAPI]
    frontend_frameworks: [React]
    ui_frameworks: [利用なし]
    testing_frameworks: [pytest]
    cloud_platforms: [AWS]
    aws_services: [Lambda, S3, Bedrock]
    azure_services: [利用なし]
    gcp_services: [利用なし]
    container: [利用なし]
    container_orchestration: [利用なし]
    ai_services: [Claude]
    skills: [Python, TypeScript]
    period: [2024-07, 現在]
    link: ""
    workflow:
      requirements: true
      basic_design: true
      detailed_design: false
      implementation_unit_test: true
      integration_test: false
      system_test: false
      maintenance_operation: true
