name: Deploy Flutter to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# リポジトリに対する書き込み権限とPagesの読み書き権限を付与
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御（古いビルドが走っている場合はキャンセルする）
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd dev_portfolio
          flutter pub get

      - name: Configure Web Support
        run: |
          cd dev_portfolio
          flutter create . --platforms web

      - name: Build web
        run: |
          cd dev_portfolio
          flutter build web --release --base-href "/dev-portfolio-site/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dev_portfolio/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4