name: Test

# push・プルリクエストのたびに、テストと網羅率（行 C0・分岐 C1 とも 90% 以上）を確かめる
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      - name: テスト（網羅率も記録）
        run: flutter test --coverage --branch-coverage

      - name: 網羅率の確認（行・分岐とも 90% 以上）
        shell: bash # pipefail を付け、tee を挟んでも失敗が伝わるように
        run: dart run tool/coverage_check.dart --min-line 90 --min-branch 90 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 網羅率のファイルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # マイページの API（services/api-hono）。型の確認と、単体・ルートのテスト（Emulator のテストは段階 7 で足す）
  api-hono:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-hono
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # package-lock.json があれば版をそろえる（npm ci）。まだなければ npm install
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm test

  # 認証（services/auth-phoenix）。コンパイル（警告もエラー）と、テスト（Firebase は偽物。Emulator の上のテストは段階 7）
  auth-phoenix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-phoenix
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.18'
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  # 見る人向けのスキルシート（services/excel-fastapi）。Excel・PDF を作る Dart のコマンド（frontend/bin/skill_sheet.dart）を
  # Dockerfile と同じやり方（dart/build.sh）で作り、本物のコマンドのテストも動かす
  excel-fastapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/excel-fastapi
    env:
      SKILL_SHEET_REAL: '1'
      SKILL_SHEET_CMD: ${{ github.workspace }}/skill_sheet
      SKILL_SHEET_TEMPLATE: ${{ github.workspace }}/frontend/assets/data/format_skill_sheet.xlsx
      FONT_PATH: ${{ github.workspace }}/frontend/assets/fonts/ipagp.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: sh dart/build.sh ../../frontend "$SKILL_SHEET_CMD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90

  # Firebase Emulator にサンプルを入れるスクリプト（firebase/seed/）のテスト。Node の標準のテストだけ（パッケージはいらない）
  firebase-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test firebase/seed/seed.test.mjs
