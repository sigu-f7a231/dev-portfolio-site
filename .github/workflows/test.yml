name: Test

# push・プルリクエストのたびに、テストと網羅率（行 C0・分岐 C1 とも 90% 以上）を確かめる
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      - name: テスト（網羅率も記録）
        run: flutter test --coverage --branch-coverage

      - name: 網羅率の確認（行・分岐とも 90% 以上）
        shell: bash # pipefail を付け、tee を挟んでも失敗が伝わるように
        run: dart run tool/coverage_check.dart --min-line 90 --min-branch 90 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 網羅率のファイルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11'
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  # Firebase Emulator にサンプルを入れるスクリプト（firebase/seed/）のテスト。Node の標準のテストだけ（パッケージはいらない）
  firebase-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test firebase/seed/seed.test.mjs
