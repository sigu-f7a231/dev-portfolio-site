projects:
  - title: 電力制御システム開発
    description: Webシステム開発において、DB設計からフロントエンド・バックエンド・モデル・UI・テストまで一貫して担当し、チームで協力してアジャイル開発を実施
    details: |
      DB設計、モデル・フォーム作成、画面表示に必要なバックエンド処理の実装一覧画面を中心としたフロントエンド開発、CSS修正、デザイン照合によるUI改善
      単体テスト作成（Coverage100%）、開発ルールに沿ったソースコード品質管理
      不具合確認、画面仕様書作成、テスト項目書作成
      チームメンバーと連携し、2週間サイクルのスクラム開発を実施
    server_os: Linux, Windows Server
    db: PostgreSQL
    tools_fw: Django2,Boostrap,RedMine,Git,GitLab,teraterm,adobeXD
    skills: Python3
    period: 2019-07 ~ 2019-12
    link: ""
    workflow:
      requirements: true
      basic_design: true
      detailed_design: true
      implementation_unit_test: true
      integration_test: true
      system_test: false
      maintenance_operation: false

