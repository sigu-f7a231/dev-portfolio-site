# ============================================================
# プロフィール（Home と About に表示する内容）
# ------------------------------------------------------------
# - インデントは半角スペース 2 つ
# - ★ の付いた項目は必須。それ以外は書かなければ表示しない
# - 複数行の文章は「|」のあとに改行して書く
# - 起動時に読み込む：dart run tool/run.dart このファイル.yaml
# ============================================================

# ---------- Home（最初の画面） ----------
home:
  name: 山田 太郎                    # ★ 名前
  role: Web / モバイルエンジニア       # ★ 職種（名前の上に小さく出る）
  tagline: |                        # ★ 紹介文（名前の下に出る）
    Flutter と Dart を中心に、Web とモバイルのフロントエンドを開発しています。
    このサイトでは、業務と個人開発で使ってきた技術と、関わったプロジェクトをまとめています。

  # 右側のカード（YAML 風に表示）。「キー: 値」か「キー: のあとに - 箇条書き」で自由に書ける
  card:
    name: Taro Yamada
    role: Web / Mobile Engineer
    stack:
      - Flutter
      - Dart
      - TypeScript
    focus: ユーザー視点の UI

# ---------- About（自己紹介） ----------
about:
  intro: |                          # ★ 自己紹介（名前・職種・簡単な経歴を 2〜3 文で）
    受託開発の会社で Web アプリの設計から実装・テストまでを担当し、
    現在は Flutter を使ったモバイル / Web アプリの開発に取り組んでいます。

  domains:                          # 得意な領域（タグで表示）
    - Web
    - モバイル
    - Flutter
    - Dart

  strengths: チーム開発、テストの設計と実施、UI の改善      # 強み

  style: コード品質を重視し、スクラムでの開発経験があります。レスポンシブ対応を前提に設計します。  # 開発スタイル

  closing: ユーザー視点での開発を常に心がけています。         # 締めの一言

# ---------- Work / Private（任意） ----------
# ここにも書くと、プロフィールと一緒に Skills と Projects も読み込みます（あとで個別にアップロードしなくてよい）。
# 書き方は Work / Private のテンプレート（format_work.yaml / format_private.yaml）の「projects:」の中身と同じです。
# - 1 件ごとに「- title:」から書き始める（複数件は続けて書く）
# - 該当しない項目は「- 利用なし」
# - Work は workflow（担当した工程）を必ず書く。Private には書かない
# - 使わないときは「work:」「private:」ごと消してください（消すと、今表示している Work / Private はそのまま）

