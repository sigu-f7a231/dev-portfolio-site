name: Deploy Develop to GitHub Pages

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        # 手元で pub get するのと同じように、ディレクトリを移動してから実行
        run: |
          cd dev_portfolio
          flutter pub get

      - name: Build web
        # 手元で chrome で動かす代わりに、Web用に出力（ビルド）する
        run: |
          cd dev_portfolio
          flutter build web --release --base-href "/dev-portfolio-site/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dev_portfolio/build/web
          publish_branch: gh-pages